; A local SIP account your softphone registers with.
;   username: 1001   password: agentdemo   server: <IP of the machine running Asterisk>:5060 (UDP)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
context=voice-agent
disallow=all
allow=ulaw,alaw
auth=1001
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=auth
auth_type=userpass
username=1001
password=agentdemo

[1001]
type=aor
max_contacts=5
remove_existing=yes
