[globals]
; host:port of the Python agent's AudioSocket server (python -m server.app)
AGENT_ADDR=127.0.0.1:9092

; Dial any number (e.g. 100) from the softphone to reach the voice agent.
; AudioSocket needs a UUID per call; we build one from built-in functions.
[voice-agent]
exten => _X.,1,Answer()
 same => n,Set(CALL_UUID=${RAND(10000000,99999999)}-${RAND(1000,9999)}-4000-8000-00${EPOCH})
 same => n,AudioSocket(${CALL_UUID},${AGENT_ADDR})
 same => n,Hangup()
