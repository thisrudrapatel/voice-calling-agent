<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2316a34a' d='M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --green: #16a34a; --red: #dc2626;
      --user: #eef2ff; --agent: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa0a6;
        --line: #2a2e36; --accent: #60a5fa; --green: #22c55e; --red: #ef4444;
        --user: #1e2a44; --agent: #22262e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
      background: var(--bg); color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px;
    }
    .phone {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
      border-radius: 24px; padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 18px;
    }
    .who { text-align: center; }
    .avatar {
      width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 50%;
      display: grid; place-items: center; font-size: 36px; font-weight: 600; color: #fff;
      background: var(--accent); position: relative;
    }
    .avatar::after {
      content: ""; position: absolute; inset: -8px; border-radius: 50%;
      border: 3px solid transparent; transition: border-color .2s;
    }
    .speaking .avatar::after { border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .listening .avatar::after { border-color: var(--green); }
    .thinking .avatar::after { border-color: var(--muted); border-top-color: transparent; animation: spin 1s linear infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: .6; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .name { font-size: 20px; font-weight: 600; }
    .status { color: var(--muted); font-size: 14px; min-height: 20px; }
    .controls { display: flex; justify-content: center; gap: 16px; }
    button {
      border: 0; border-radius: 999px; height: 56px; padding: 0 28px; font-size: 16px; font-weight: 600;
      color: #fff; cursor: pointer;
    }
    #call { background: var(--green); }
    #hangup { background: var(--red); display: none; }
    #mute { background: var(--muted); display: none; }
    .in-call #call { display: none; }
    .in-call #hangup, .in-call #mute { display: inline-block; }
    .log {
      border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px;
      max-height: 46vh; overflow-y: auto;
    }
    .msg { padding: 8px 12px; border-radius: 14px; max-width: 85%; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.agent { align-self: flex-start; background: var(--agent); }
    .hint { color: var(--muted); font-size: 13px; text-align: center; }
    .meta { color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="phone" id="phone">
    <div class="who">
      <div class="avatar" id="avatar">A</div>
      <div class="name" id="name">Voice Agent</div>
      <div class="status" id="status">Ready to call</div>
    </div>
    <div class="controls">
      <button id="call">Call</button>
      <button id="mute">Mute</button>
      <button id="hangup">End</button>
    </div>
    <p class="hint">Use headphones for the smoothest conversation. You can interrupt the agent at any time.</p>
    <section class="log" id="log" aria-live="polite"></section>
    <div class="meta" id="meta"></div>
  </main>
  <script src="/static/phone.js"></script>
</body>
</html>
